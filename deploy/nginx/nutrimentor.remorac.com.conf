# NutriMentor — nginx reverse proxy for the Go backend.
#
# Install:  sudo cp deploy/nginx/nutrimentor.remorac.com.conf \
#             /etc/nginx/sites-available/nutrimentor.remorac.com
#           sudo ln -sf /etc/nginx/sites-available/nutrimentor.remorac.com \
#             /etc/nginx/sites-enabled/nutrimentor.remorac.com
#           sudo nginx -t && sudo systemctl reload nginx
#
# TLS: this file ships only the plain :80 server. Run
#   sudo certbot --nginx -d nutrimentor.remorac.com
# and certbot rewrites this file to add the :443 server + HTTP->HTTPS redirect
# and manages renewal. (deploy/setup.sh does this for you.)

server {
    listen 80;
    listen [::]:80;
    server_name nutrimentor.remorac.com;

    # Article cover-image uploads; keep in sync with any app-side limit.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
