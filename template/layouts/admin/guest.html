{{define "guest.html"}}<!DOCTYPE html>
<html lang="id" data-theme="{{.Theme}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="min-h-screen grid lg:grid-cols-2 bg-base-200">
  <div class="hidden lg:flex flex-col justify-between bg-primary text-primary-content p-12">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-primary-content/15 grid place-items-center"><i data-lucide="activity"></i></div>
      <div><div class="font-bold text-lg leading-tight">SebayaDM</div><div class="text-xs opacity-70">Admin Panel</div></div>
    </div>
    <div>
      <h2 class="text-3xl font-bold leading-snug mb-4">Edukasi Manajemen Diabetes<br>Kelompok Sebaya</h2>
      <p class="opacity-70 text-sm max-w-sm">Pantau kepatuhan diet, konsumsi obat, aktivitas fisik, dan perawatan mandiri penderita Diabetes Mellitus.</p>
    </div>
    <p class="opacity-40 text-xs">&copy; {{.Year}} SebayaDM</p>
  </div>
  <div class="flex items-center justify-center p-8">
    <div class="w-full max-w-sm">
      {{template "content" .}}
    </div>
  </div>
<script>lucide.createIcons();</script>
</body>
</html>{{end}}
