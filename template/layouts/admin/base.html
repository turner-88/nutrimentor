{{define "base.html"}}<!DOCTYPE html>
<html lang="id" data-theme="{{.Theme}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} — SebayaDM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="min-h-screen bg-base-200">
<div class="drawer lg:drawer-open">
  <input id="nav-drawer" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content flex flex-col">
    <!-- Topbar -->
    <div class="navbar bg-base-100 border-b border-base-300 lg:hidden">
      <label for="nav-drawer" class="btn btn-square btn-ghost"><i data-lucide="menu"></i></label>
      <span class="font-bold ms-2">SebayaDM</span>
    </div>
    <main class="p-4 md:p-8 max-w-6xl w-full mx-auto">
      <h1 class="text-2xl font-bold mb-6">{{.Title}}</h1>
      {{template "content" .}}
    </main>
  </div>
  <div class="drawer-side z-20">
    <label for="nav-drawer" class="drawer-overlay"></label>
    <aside class="w-64 min-h-full bg-base-100 border-e border-base-300 flex flex-col">
      <div class="px-5 py-4 border-b border-base-300 flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-primary text-primary-content grid place-items-center">
          <i data-lucide="activity"></i>
        </div>
        <div>
          <div class="font-bold leading-tight">SebayaDM</div>
          <div class="text-xs opacity-60 leading-tight">Admin Panel</div>
        </div>
      </div>
      <ul class="menu p-3 gap-1 flex-1">
        {{$n := .ActiveNav}}
        <li><a href="/admin/dashboard" class="{{if eq $n "dashboard"}}menu-active{{end}}"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
        <li><a href="/admin/patients" class="{{if eq $n "patients"}}menu-active{{end}}"><i data-lucide="users"></i> Responden</a></li>
        <li><a href="/admin/groups" class="{{if eq $n "groups"}}menu-active{{end}}"><i data-lucide="users-round"></i> Kelompok Sebaya</a></li>
        <li><a href="/admin/articles" class="{{if eq $n "articles"}}menu-active{{end}}"><i data-lucide="book-open"></i> Edukasi</a></li>
        <li><a href="/admin/monitoring" class="{{if eq $n "monitoring"}}menu-active{{end}}"><i data-lucide="line-chart"></i> Monitoring</a></li>
        <li><a href="/admin/audit" class="{{if eq $n "audit"}}menu-active{{end}}"><i data-lucide="history"></i> Audit Trail</a></li>
      </ul>
      <div class="p-3 border-t border-base-300">
        {{with .AuthUser}}<div class="px-2 text-sm opacity-70 mb-2">{{.Username}}</div>{{end}}
        <a href="/admin/logout" class="btn btn-ghost btn-sm w-full justify-start"><i data-lucide="log-out"></i> Keluar</a>
      </div>
    </aside>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>{{end}}
