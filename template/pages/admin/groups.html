{{define "actions"}}
<a href="/admin/groups/new" class="btn btn-sm btn-primary"><i data-lucide="plus"></i> Kelompok Baru</a>
{{end}}

{{define "content"}}
<div class="card">
  <div class="table-wrap">
    <table class="table">
      <thead><tr><th>Nama</th><th>Deskripsi</th><th class="num">Anggota</th><th></th></tr></thead>
      <tbody>
        {{range .Rows}}
        <tr>
          <td>
            <div class="who">
              <div class="avatar" style="background:color-mix(in srgb,var(--color-secondary) 12%,white);color:var(--color-secondary)"><i data-lucide="users-round" class="w-4 h-4"></i></div>
              <div class="who-name">{{.G.Name}}</div>
            </div>
          </td>
          <td class="text-base-content/60 text-sm max-w-xs">{{if .G.Description}}{{.G.Description}}{{else}}<span class="text-base-content/30">—</span>{{end}}</td>
          <td class="num"><span class="pill pill-muted">{{.Members}}</span></td>
          <td class="text-right"><a href="/admin/groups/{{.G.ID}}" class="btn btn-xs btn-ghost">Detail <i data-lucide="chevron-right"></i></a></td>
        </tr>
        {{else}}
        <tr><td colspan="4">
          <div class="empty">
            <div class="empty-ic"><i data-lucide="users-round"></i></div>
            <div class="empty-title">Belum ada kelompok</div>
            <p class="empty-hint">Buat kelompok sebaya pertama lewat tombol Kelompok Baru.</p>
          </div>
        </td></tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
