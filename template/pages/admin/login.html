{{define "content"}}
<h1 class="text-2xl font-bold mb-1">Masuk</h1>
<p class="text-sm opacity-60 mb-6">Silakan masuk untuk mengelola SebayaDM.</p>
{{if .Error}}<div class="alert alert-error text-sm mb-4"><i data-lucide="alert-circle"></i><span>{{.Error}}</span></div>{{end}}
<form method="post" action="/admin/login" class="space-y-4">
  <label class="input input-bordered flex items-center gap-2 w-full">
    <i data-lucide="user" class="w-4 h-4 opacity-60"></i>
    <input type="text" name="username" placeholder="Username" value="{{.Username}}" class="grow" required autofocus>
  </label>
  <label class="input input-bordered flex items-center gap-2 w-full">
    <i data-lucide="lock" class="w-4 h-4 opacity-60"></i>
    <input type="password" name="password" placeholder="Password" class="grow" required>
  </label>
  <button type="submit" class="btn btn-primary w-full">Masuk</button>
</form>
{{end}}
