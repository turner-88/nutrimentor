{{define "content"}}
<div class="mb-8">
  <div class="lg:hidden brand-mark w-11 h-11 mb-4"><i data-lucide="activity"></i></div>
  <h1 class="font-heading text-2xl font-bold mb-1" style="color:var(--color-ink)">Masuk</h1>
  <p class="text-sm text-base-content/55">Silakan masuk untuk mengelola NutriMentor.</p>
</div>
{{if .Error}}<div class="alert alert-error text-sm mb-5"><i data-lucide="alert-circle"></i><span>{{.Error}}</span></div>{{end}}
<form method="post" action="/admin/login" class="flex flex-col gap-4">
  <div class="field">
    <span class="label-text">Username</span>
    <label class="input input-bordered">
      <i data-lucide="user" class="w-4 h-4 opacity-50"></i>
      <input type="text" name="username" placeholder="Masukkan username" value="{{.Username}}" required autofocus>
    </label>
  </div>
  <div class="field">
    <span class="label-text">Password</span>
    <label class="input input-bordered">
      <i data-lucide="lock" class="w-4 h-4 opacity-50"></i>
      <input type="password" name="password" placeholder="Masukkan password" required>
    </label>
  </div>
  <button type="submit" class="btn btn-primary w-full mt-1"><i data-lucide="log-in"></i> Masuk</button>
</form>
{{end}}
