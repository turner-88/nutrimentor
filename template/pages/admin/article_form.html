{{define "content"}}
<a href="/admin/articles" class="btn btn-ghost btn-sm mb-4"><i data-lucide="arrow-left"></i> Kembali</a>
<div class="card bg-base-100 shadow-sm max-w-2xl">
  <div class="card-body">
    <form method="post" action="{{if .IsNew}}/admin/articles/new{{else}}/admin/articles/{{.A.ID}}/edit{{end}}" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label class="label"><span class="label-text">Judul</span></label>
        <input type="text" name="title" value="{{.A.Title}}" class="input input-bordered w-full" required>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="label"><span class="label-text">Slug (opsional)</span></label>
          <input type="text" name="slug" value="{{.A.Slug}}" placeholder="otomatis dari judul" class="input input-bordered w-full">
        </div>
        <div>
          <label class="label"><span class="label-text">Kategori</span></label>
          <input type="text" name="category" value="{{.A.Category}}" class="input input-bordered w-full">
        </div>
      </div>
      <div>
        <label class="label"><span class="label-text">Gambar Sampul</span></label>
        <input type="file" name="cover" accept="image/*" class="file-input file-input-bordered w-full">
        <input type="hidden" name="existing_cover" value="{{.A.CoverImagePath}}">
        {{if .A.CoverImagePath}}<img src="{{.A.CoverImagePath}}" class="mt-2 h-24 rounded-lg object-cover">{{end}}
      </div>
      <div>
        <label class="label"><span class="label-text">Isi (HTML)</span></label>
        <textarea name="body_html" rows="12" class="textarea textarea-bordered w-full font-mono text-sm" required>{{.A.BodyHtml}}</textarea>
      </div>
      <div class="flex items-center gap-6">
        <label class="label cursor-pointer gap-2">
          <input type="checkbox" name="is_published" class="checkbox checkbox-primary" {{if .A.IsPublished}}checked{{end}}>
          <span class="label-text">Terbitkan</span>
        </label>
        <div class="flex items-center gap-2">
          <span class="label-text">Urutan</span>
          <input type="number" name="sort_order" value="{{.A.SortOrder}}" class="input input-bordered input-sm w-20">
        </div>
      </div>
      <button class="btn btn-primary">Simpan Artikel</button>
    </form>
  </div>
</div>
{{end}}
